<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candy | Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body onload="showLiveTime()">
    <nav class="navbar">
      <div class="nav-container">
        <span class="logo">Candy's Space ✨</span>
        <div class="nav-links">
          <a href="index.html" class="nav-link active">Home</a>
          <a href="about.html" class="nav-link">About Me</a>
        </div>
      </div>
    </nav>
    <main class="home-container">
      <p
        id="time-display"
        style="
          font-weight: bold;
          text-align: center;
          color: #555;
          margin-top: 15px;
        "
      ></p>

      <section class="hero-section">
        <div class="hero-text">
          <p class="greeting">Hello! I’m</p>
          <h1 class="my-name">Candy</h1>
          <p class="role">
            Industrial Engineering and Logistics Management Student
          </p>
          <p class="welcome-msg">Welcome to my personal website.</p>
          <br />
          <a href="about.html" class="btn-about">About Me ➜</a>
        </div>
        <div class="hero-image">
          <img src="profile1.jpg" alt="Candy" class="profile-pic" />
        </div>
      </section>

      <hr class="divider" />

      <section class="quote-section">
        <div class="quote-box" onclick="changeQuote()" style="cursor: pointer">
          <p class="quote-text" id="target-quote">
            "The only way to do great work is to love what you do."
          </p>
          <p class="quote-author" id="target-author">- Steve Jobs</p>
        </div>
        <div class="quote-image">
          <img src="profile2.jpg" alt="Candy Photo" class="sub-pic" />
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 Candy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
